  <line x1="260" y1="350" x2="200" y2="435" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="193" y="383" width="74" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
