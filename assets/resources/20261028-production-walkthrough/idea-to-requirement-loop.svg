  <line x1="600" y1="511" x2="600" y2="550" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="626" x2="600" y2="665" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="555" x2="410" y2="790" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="741" x2="600" y2="790" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="900" x2="600" y2="950" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="1046" x2="600" y2="1095" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="1139" x2="180" y2="1200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="1139" x2="470" y2="1200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="1139" x2="740" y2="1200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="1139" x2="1030" y2="1200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 180,1200 C 90,1200 50,1050 50,850 C 50,550 90,240 460,210"
    fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-dashed)"/>
  <rect x="60" y="720" width="130" height="18" rx="3" fill="#ffffff" opacity="0.9"/>
  <text x="125" y="734" text-anchor="middle" class="arrow-label">feeds back to Stage A</text>
  <rect x="380" y="1380" width="440" height="130" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="600" y="1404" text-anchor="middle" class="subgraph-title">Legend</text>
  <rect x="400" y="1420" width="18" height="18" rx="3" fill="#4A90D9" stroke="#2E6EB5" stroke-width="1.5"/>
  <text x="426" y="1434" class="legend-text">Core Stage Agent</text>
  <rect x="540" y="1420" width="18" height="18" rx="3" fill="#F5A623" stroke="#D4880E" stroke-width="1.5"/>
  <text x="566" y="1434" class="legend-text">Parallel Stage Agent</text>
  <rect x="680" y="1420" width="18" height="18" rx="3" fill="#7ED321" stroke="#5CA318" stroke-width="1.5"/>
  <text x="706" y="1434" class="legend-text">Terminal (User/Output)</text>
  <rect x="400" y="1454" width="18" height="18" rx="3" fill="#9B9B9B" stroke="#7A7A7A" stroke-width="1.5"/>
  <text x="426" y="1468" class="legend-text">Cross-Cutting Agent</text>
  <rect x="540" y="1454" width="18" height="18" rx="3" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="566" y="1468" class="legend-text">Input / Trigger</text>
  <line x1="400" y1="1492" x2="440" y2="1492" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
