  <line x1="620" y1="1492" x2="660" y2="1492" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-dashed)"/>
  <text x="670" y="1497" class="legend-text">Feedback / Async</text>
