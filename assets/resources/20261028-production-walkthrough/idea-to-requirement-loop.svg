<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { font: bold 26px Arial; fill: #1a1a2e; }
    .subtitle { font: 15px Arial; fill: #6b7280; }
    .node-title { font: bold 15px Arial; fill: #ffffff; }
    .node-text { font: 13px Arial; fill: #ffffff; }
    .node-text-dark { font: 13px Arial; fill: #1a1a2e; }
    .arrow-label { font: 12px Arial; fill: #6b7280; }
    .subgraph-title { font: bold 14px Arial; fill: #374151; }
    .legend-text { font: 13px Arial; fill: #374151; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="1600" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" class="title">End-to-End Agent Interaction Map</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle">KylinAgents Main Workflow - From Idea to Production</text>
  <rect x="490" y="90" width="220" height="48" rx="24" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" class="node-title">Business Idea / User Feedback</text>
  <rect x="440" y="165" width="320" height="76" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="600" y="187" text-anchor="middle" class="node-title">Stage A: Product and Program Manager AI</text>
  <text x="600" y="205" text-anchor="middle" class="node-text">Skill: requirement-writer</text>
  <text x="600" y="221" text-anchor="middle" class="node-text">-&gt; requirement.md (PRD)</text>
  <rect x="260" y="290" width="300" height="96" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="410" y="312" text-anchor="middle" class="node-title">Stage B: Engineering Architecture AI</text>
  <text x="410" y="330" text-anchor="middle" class="node-text">solution-architect -&gt; solution.md</text>
  <text x="410" y="346" text-anchor="middle" class="node-text">core-module-designer -&gt;</text>
  <text x="410" y="362" text-anchor="middle" class="node-text">core_module_design.md</text>
  <rect x="640" y="290" width="300" height="96" rx="8" fill="#F5A623" stroke="#D4880E" stroke-width="2"/>
  <text x="790" y="312" text-anchor="middle" class="node-title">Stage C: UI/UX and App Writer AI</text>
  <text x="790" y="330" text-anchor="middle" class="node-text">Skill: ui-designer</text>
  <text x="790" y="346" text-anchor="middle" class="node-text">-&gt; ui_design.md</text>
  <rect x="440" y="435" width="320" height="76" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="600" y="457" text-anchor="middle" class="node-title">Stage D: Full-Stack Software Engineer AI</text>
  <text x="600" y="475" text-anchor="middle" class="node-text">Skill: detailed-design</text>
  <text x="600" y="491" text-anchor="middle" class="node-text">-&gt; tech_design.md</text>
  <rect x="440" y="550" width="320" height="76" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="600" y="572" text-anchor="middle" class="node-title">Stage E: QA and Release Manager AI</text>
  <text x="600" y="590" text-anchor="middle" class="node-text">Skill: ta-solution-architect</text>
  <text x="600" y="606" text-anchor="middle" class="node-text">-&gt; ta_solution.md</text>
  <rect x="440" y="665" width="320" height="76" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="600" y="687" text-anchor="middle" class="node-title">Stage F: Full-Stack Software Engineer AI</text>
  <text x="600" y="705" text-anchor="middle" class="node-text">Skill: implementation-planner</text>
  <text x="600" y="721" text-anchor="middle" class="node-text">-&gt; plan.md</text>
  <rect x="60" y="435" width="280" height="120" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="200" y="457" text-anchor="middle" class="node-title">Stage G: Repo Scaffolding</text>
  <text x="200" y="475" text-anchor="middle" class="node-text">Engineering Architecture AI</text>
  <text x="200" y="491" text-anchor="middle" class="node-text">repo-skeleton-creator</text>
  <text x="200" y="507" text-anchor="middle" class="node-text">repo-instruction-files</text>
  <text x="200" y="523" text-anchor="middle" class="node-text">repo-app-creator</text>
  <text x="200" y="539" text-anchor="middle" class="node-text">-&gt; repo skeleton + git remote</text>
  <rect x="350" y="790" width="500" height="110" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="600" y="812" text-anchor="middle" class="node-title">Stage H: Implementation</text>
  <text x="600" y="830" text-anchor="middle" class="node-text">Full-Stack Software Engineer AI</text>
  <text x="600" y="846" text-anchor="middle" class="node-text">Skill: feature-implementer</text>
  <text x="600" y="862" text-anchor="middle" class="node-text">Reads: plan, tech_design, ui_design,</text>
  <text x="600" y="878" text-anchor="middle" class="node-text">ta_solution, solution, requirement</text>
  <text x="600" y="894" text-anchor="middle" class="node-text">-&gt; Code + Tests + IaC</text>
  <rect x="400" y="950" width="400" height="96" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="600" y="972" text-anchor="middle" class="node-title">Stage I: QA, Release and Deployment</text>
  <text x="600" y="990" text-anchor="middle" class="node-text">QA and Release Manager AI</text>
  <text x="600" y="1006" text-anchor="middle" class="node-text">Test execution, Quality gates, CI/CD</text>
  <text x="600" y="1022" text-anchor="middle" class="node-text">Deployment, Monitoring, SLO/SLI</text>
  <rect x="500" y="1095" width="200" height="44" rx="22" fill="#7ED321" stroke="#5CA318" stroke-width="2"/>
  <text x="600" y="1123" text-anchor="middle" class="node-title">END USER (Production)</text>
  <rect x="50" y="1200" width="260" height="110" rx="8" fill="#4A90D9" stroke="#2E6EB5" stroke-width="2"/>
  <text x="180" y="1222" text-anchor="middle" class="node-title">Stage J (Ops): Service and Data Op AI</text>
  <text x="180" y="1240" text-anchor="middle" class="node-text">User feedback, Retention</text>
  <text x="180" y="1256" text-anchor="middle" class="node-text">Demand reports</text>
  <text x="180" y="1272" text-anchor="middle" class="node-text">Data pipelines, SRE/reliability</text>
  <rect x="340" y="1200" width="260" height="110" rx="8" fill="#F5A623" stroke="#D4880E" stroke-width="2"/>
  <text x="470" y="1222" text-anchor="middle" class="node-title">Stage J (Growth): Social Media AI</text>
  <text x="470" y="1240" text-anchor="middle" class="node-text">Content creation, Platform op</text>
  <text x="470" y="1256" text-anchor="middle" class="node-text">Traffic campaigns</text>
  <text x="470" y="1272" text-anchor="middle" class="node-text">Launch promotion</text>
  <rect x="610" y="1200" width="260" height="110" rx="8" fill="#9B9B9B" stroke="#7A7A7A" stroke-width="2"/>
  <text x="740" y="1222" text-anchor="middle" class="node-title">Auto Iteration Sentry AI</text>
  <text x="740" y="1240" text-anchor="middle" class="node-text">Quality review, Gap checking</text>
  <text x="740" y="1256" text-anchor="middle" class="node-text">Anomaly intercept</text>
  <text x="740" y="1272" text-anchor="middle" class="node-text">Rhythm alignment</text>
  <rect x="900" y="1200" width="260" height="110" rx="8" fill="#9B9B9B" stroke="#7A7A7A" stroke-width="2"/>
  <text x="1030" y="1222" text-anchor="middle" class="node-title">General Admin and Finance AI</text>
  <text x="1030" y="1240" text-anchor="middle" class="node-text">Efficiency stats, Cost monitoring</text>
  <text x="1030" y="1256" text-anchor="middle" class="node-text">Operation reports</text>
  <line x1="600" y1="138" x2="600" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="241" x2="410" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="241" x2="790" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
